<!DOCTYPE html>
<html lang="id">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SITTA UT - Tugas Praktik 3</title>

<link rel="stylesheet" href="assets/css/style.css">

</head>

<body>

<div id="app">

<header>

<div class="header-content">

<div class="logo">
<span>SITTA</span> UT
</div>

<nav>

<ul>

<li>
<button
class="btn"
@click="tab='stok'">
📦 Stok
</button>
</li>

<li>
<button
class="btn btn-secondary"
@click="tab='tracking'">
🚚 Tracking DO
</button>
</li>

<li>
<button
class="btn"
@click="tab='order'">
📝 Pemesanan
</button>
</li>

</ul>

</nav>

</div>

</header>

<main>

<!-- STOK -->

<section v-show="tab==='stok'">

<ba-stock-table
:items="state.stok"
:upbjj-list="state.upbjjList"
:kategori-list="state.kategoriList">
</ba-stock-table>

</section>

<!-- TRACKING -->

<section v-show="tab==='tracking'">

<do-tracking
:data="state.tracking">
</do-tracking>

</section>

<!-- ORDER -->

<section v-show="tab==='order'">

<order-form
:paket="state.paket"
:ekspedisi="state.pengirimanList"
@created="handleNewDO">
</order-form>

</section>

<!-- MODAL -->

<app-modal ref="modal"></app-modal>

</main>

</div>

<!-- Templates -->

<!-- <template id="tpl-stock"></template>

<template id="tpl-tracking"></template>

<template id="tpl-order"></template>

<template id="tpl-badge"></template>

<template id="tpl-modal"></template> -->

<!-- Vue -->

<script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>

<!-- Service -->

<script src="js/services/api.js"></script>

<!-- Components -->

<script src="js/components/status-badge.js"></script>
<script src="js/components/app-modal.js"></script>
<script src="js/components/stock-table.js"></script>
<script src="js/components/do-tracking.js"></script>
<script src="js/components/order-form.js"></script>

<!-- Root -->

<script src="js/app.js"></script>

</body>
</html>
