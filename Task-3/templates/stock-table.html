<template id="tpl-stock">

<div>

<!-- FILTER -->

<div class="card">

<h2>📦 Manajemen Stok Bahan Ajar</h2>

<br>

<div class="form-grid">

<select v-model="filterUpbjj">

<option value="">
Semua UPBJJ
</option>

<option
v-for="u in upbjjList"
:key="u">

{{u}}

</option>

</select>

<select
v-model="filterKategori"
v-if="filterUpbjj">

<option value="">
Semua Kategori
</option>

<option
v-for="k in kategoriList"
:key="k">

{{k}}

</option>

</select>

<select v-model="sortBy">

<option value="">
Sort Default
</option>

<option value="judul">
Judul
</option>

<option value="qty">
Stok
</option>

<option value="harga">
Harga
</option>

</select>

<label>

<input
type="checkbox"
v-model="warningOnly">

 Hanya Warning

</label>

<button
class="btn btn-danger"
@click="resetFilter">

Reset

</button>

</div>

</div>

<!-- FORM -->

<div class="card mt-2">

<h3>

{{ editIndex === null
? '➕ Tambah Data'
: '✏ Edit Data' }}

</h3>

<br>

<div class="form-grid">

<input
v-model="form.kode"
placeholder="Kode MK"
@keyup.enter="saveData">

<input
v-model="form.judul"
placeholder="Judul MK"
@keyup.enter="saveData">

<select v-model="form.kategori">

<option value="">
Pilih Kategori
</option>

<option
v-for="k in kategoriList">

{{k}}

</option>

</select>

<select v-model="form.upbjj">

<option value="">
Pilih UPBJJ
</option>

<option
v-for="u in upbjjList">

{{u}}

</option>

</select>

<input
v-model="form.lokasiRak"
placeholder="Lokasi Rak">

<input
type="number"
v-model.number="form.harga"
placeholder="Harga">

<input
type="number"
v-model.number="form.qty"
placeholder="Qty">

<input
type="number"
v-model.number="form.safety"
placeholder="Safety Stock">

</div>

<br>

<textarea
v-model="form.catatanHTML"
placeholder="Catatan HTML">
</textarea>

<div
class="alert"
v-if="errorMessage">

{{errorMessage}}

</div>

<div class="form-actions">

<button
class="btn"
@click="saveData">

{{ editIndex === null
? 'Tambah'
: 'Update' }}

</button>

<button
v-if="editIndex !== null"
class="btn btn-danger"
@click="cancelEdit">

Batal

</button>

</div>

</div>

<!-- TABLE -->

<div class="card mt-2">

<h3>

Total Data:
{{ filteredStock.length }}

</h3>

<table>

<thead>

<tr>

<th>Kode</th>
<th>Judul</th>
<th>Kategori</th>
<th>UPBJJ</th>
<th>Lokasi</th>
<th>Harga</th>
<th>Qty</th>
<th>Safety</th>
<th>Status</th>
<th>Aksi</th>

</tr>

</thead>

<tbody>

<tr
v-for="(item,index) in filteredStock"
:key="index">

<td v-text="item.kode"></td>

<td>
{{item.judul}}
</td>

<td>
{{item.kategori}}
</td>

<td>
{{item.upbjj}}
</td>

<td>
{{item.lokasiRak}}
</td>

<td>
{{formatRupiah(item.harga)}}
</td>

<td>
{{item.qty}} buah
</td>

<td>
{{item.safety}} buah
</td>

<td
class="pointer"
@mouseover="showTooltip(index)"
@mouseleave="hideTooltip">

<status-badge
:qty="item.qty"
:safety="item.safety">
</status-badge>

<div
class="tooltip"
v-if="tooltipIndex===index"
v-html="item.catatanHTML">

</div>

</td>

<td>

<button
class="btn"
@click="editData(index,item)">

Edit

</button>

<button
class="btn btn-danger"
@click="deleteData(index)">

Delete

</button>

</td>

</tr>

</tbody>

</table>

</div>

</div>

</template>
